<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindCare AI - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🧠 MindCare AI</h1>
        <p class="subtitle">Your Mental Wellness Companion</p>
    </div>

    <div class="login-box">

        <h2>Welcome Back 👋</h2>

        <p class="login-text">
            Login to continue your conversation
        </p>

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button onclick="login()">
            Login
        </button>

        <p class="signup-text">
            Don't have an account?
            <a href="register.html">Sign Up</a>
        </p>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
