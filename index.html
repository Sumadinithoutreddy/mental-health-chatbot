<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare AI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>🧠 MindCare AI</h1>
<p class="subtitle" id="welcome-text">
    Your Mental Wellness Companion
</p>
        <div class="header-buttons">

    <button class="clear-btn" onclick="clearChat()">
        🧹 Clear Chat
    </button>

    <button class="delete-btn" onclick="deleteHistory()">
        🗑️ Delete History
    </button>

    <button class="logout-btn" onclick="logout()">
        🚪 Logout
    </button>

</div>
    </div>

    <div id="chat-box">

    <div class="welcome-message">
        <h2>🧠 Welcome to MindCare AI</h2>

        <p>
            I'm here to listen. How are you feeling today?
        </p>

        <div class="mood-buttons">
            <button onclick="selectMood('I am feeling happy today.')">😊 Happy</button>
            <button onclick="selectMood('I am feeling sad today.')">😔 Sad</button>
            <button onclick="selectMood('I am feeling stressed today.')">😰 Stressed</button>
            <button onclick="selectMood('I am feeling angry today.')">😡 Angry</button>
        </div>
    </div>

</div>

    <div class="input-area">
        <input
            type="text"
            id="message"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>
    </div>

</div>

<script>

if(!localStorage.getItem("token")){
    alert("Please login first");
    window.location.href = "login.html";
}

</script>
<script>

if(!localStorage.getItem("token")){
    alert("Please login first");
    window.location.href = "login.html";
}

</script>

<script>

const userName = localStorage.getItem("name");

if(userName){

    document.getElementById("welcome-text").innerText =
        `Welcome back, ${userName}! 👋`;

}

</script>

<script src="script.js"></script>

</body>
</html>
